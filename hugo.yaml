baseURL: "https://vaishnavmhetre.github.io/"
locale: en-US
title: "Vaishnav Mhetre"
theme: ["github.com/adityatelange/hugo-PaperMod"]
enableRobotsTXT: true
enableEmoji: true
# The approved tag vocabulary is lowercase kebab (data-delivery, gcp). Hugo
# title-cases generated titles by default, which rendered terms as
# "Data-Delivery" / "Gcp" in /tags/, on /tags/<term>/, and in every
# <title>/og/twitter/JSON-LD value head.html derives from .Title. `none` keeps
# generated titles verbatim, so a term name IS the vocabulary everywhere.
titleCaseStyle: none
# Hugo's DEFAULT taxonomy set adds `categories`: an empty page no content file
# uses and nothing links to, while the contract's URL table lists /tags/ only.
# Dropping the unused axis beats papering over its lowercase title.
taxonomies:
  tag: tags
paginate: 10
timeout: 60s
module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod
params:
  env: production
  # Slice 05 tag axis (contract D5): a tag term needs this many entries to be
  # worth indexing, listing in the sitemap, and rendering as a pill. One
  # threshold, read by head.html (noindex), entry-card.html (pills) and
  # _default/sitemap.xml (sitemap) — change it here, not in the templates.
  minTagEntries: 2

  # Favicons. layouts/partials/head.html reads these; before they existed every
  # value was nil, so the template's defaults fired and pointed at files that
  # were never in the repo — three 404s on every page load, on every deploy
  # since the favicon links were added in 9652d7b. favicon.svg is the master;
  # the PNG/ICO rasters are generated from it (see static/favicon.svg).
  # theme_color follows the site: espresso, the dark-theme default surface.
  assets:
    favicon: /favicon.ico
    favicon16x16: /favicon-16x16.png
    favicon32x32: /favicon-32x32.png
    faviconSvg: /favicon.svg
    apple_touch_icon: /apple-touch-icon.png
    safari_pinned_tab: /safari-pinned-tab.svg
    theme_color: "#140B06"
    msapplication_TileColor: "#140B06"
  title: "Vaishnav Mhetre — Platform Engineer & Data Engineer"
  description: "Binary data delivery, event-driven systems, and microservices on GCP — engineer-facing portfolio and blog."
  keywords: ["Java", "TypeScript", "Node.js", "GCP", "Spring Boot", "Kafka", "event-driven", "microservices", "binary data delivery", "motor insurance", "market data"]
  author: "Vaishnav Mhetre"
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  showtoc: false
  hideSummary: false
  goatcounter:
    enabled: false
    code: ""
  homeMode: "home-info"
  designDirection: "animation-forward"
  homeInfoParams:
    Title: "Vaishnav Mhetre"
    Content: "Motor-insurance + market-data platform engineer. I design event-driven systems, microservices, and binary data delivery, and I write about [data delivery] and [building this site]."
  socialIcons:
    - name: github
      url: "https://github.com/vaishnavmhetre"
    - name: linkedin
      url: "https://www.linkedin.com/in/vaishnav-mhetre/"   # USER: confirm handle
  cover:
    hiddenInSingle: true
menu:
  main:
    - identifier: writing
      name: Writing
      url: /writing/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
  goldmark:
    renderer:
      unsafe: false